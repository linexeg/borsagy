<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="540" height="160" rx="24" fill="#FFFFFF"/>
  <rect x="2" y="2" width="536" height="156" rx="22" stroke="#10B981" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Candlestick Emblem (شعار الشموع اليابانية الصاعدة مع درع الحماية وحرف الباء) -->
  <g transform="translate(36, 20)" filter="url(#glow)">
    <!-- Outer Protective Shield Contour -->
    <path d="M60 6L110 24V64C110 93 86 112 60 119C34 112 10 93 10 64V24L60 6Z" fill="#10B981" fill-opacity="0.12" stroke="url(#emeraldGrad)" stroke-width="3"/>
    <path d="M60 14L100 29V61C100 86 80 102 60 109V14Z" fill="#10B981" fill-opacity="0.06"/>

    <!-- 3 Ascending Candlesticks (شموع صاعدة مع فتائل دقيقة) -->
    <!-- Candle 1 (Green) -->
    <line x1="38" y1="46" x2="38" y2="84" stroke="#10B981" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="33" y="55" width="10" height="23" rx="2.5" fill="url(#emeraldGrad)"/>

    <!-- Candle 2 (Green) -->
    <line x1="60" y1="28" x2="60" y2="84" stroke="#10B981" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="55" y="38" width="10" height="40" rx="2.5" fill="url(#emeraldGrad)"/>

    <!-- Candle 3 (Gold Leader Candle) -->
    <line x1="82" y1="18" x2="82" y2="84" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="77" y="27" width="10" height="51" rx="2.5" fill="url(#goldGrad)"/>

    <!-- Arabic Letter Baa Base Curve and Gold SI Anchor Node -->
    <path d="M26 76C26 86 38 90 60 90C82 90 94 86 94 76" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="60" cy="103" r="5.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Wordmark -->
  <text x="176" y="74" fill="#0A1410" font-family="Cairo, Readex Pro, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">بورصجي</text>
  <text x="358" y="74" fill="#10B981" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="28">borsagy.si</text>
  <text x="176" y="110" fill="#475569" font-family="Readex Pro, Cairo, sans-serif" font-weight="500" font-size="16">المرافق الذكي للمضاربين في البورصة المصرية</text>
  <text x="176" y="134" fill="#F59E0B" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="12">SUPERINTELLIGENCE COMPANION · EGX · borsgai.si</text>
</svg>